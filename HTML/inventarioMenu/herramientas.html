<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Herramientas - ERP Mecatrónica</title>
    <link rel="stylesheet" href="../../CSS/estilos.css">
    <link rel="stylesheet" href="../../CSS/menu.css">
</head>

<body class="theme-inventario">
    <div class="app-body">
        <main class="main-content">

            <header class="header">
                <div class="header-info">
                    <h1>Gestión de Herramientas</h1>
                    <p>Catálogo técnico, estado y ubicación en taller</p>
                </div>
                <div class="header-actions" style="display: flex; gap: 10px; align-items: center;">
                    <div class="search-bar" style="display: flex; gap: 5px;">
                        <input type="text" id="busquedaHerramienta" placeholder="Buscar por ID o Nombre..." 
                               onkeyup="filtrarHerramientas()"
                               style="padding: 10px; border: 1px solid #bdc3c7; border-radius: 5px; min-width: 250px;">
                        <button class="btn btn-primary" onclick="filtrarHerramientas()">Buscar</button>
                    </div>
                    <button class="btn btn-primary" onclick="abrirModalHerramienta()">
                        + Añadir Nueva Herramienta
                    </button>
                </div>
            </header>

            <!-- ==================================================================
                 TABLA DE DATOS
                 Se rellena dinámicamente desde Js/herramientas.js -> cargarHerramientas()
                 Interactúa con api/inventario/herramientas.php
                 ================================================================== -->
            <section class="table-container">
                <table id="tabla-herramientas">
                    <thead>
                        <tr>
                            <th class="col-id">ID</th>
                            <th>Código Interno</th>
                            <th>Nombre</th>
                            <th>Tipo</th>
                            <th>Estado</th>
                            <th>Ubicación</th>
                            <th class="col-acciones">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-herramientas-body">
                    </tbody>
                </table>
            </section>
        </main>

        <!-- ==================================================================
             MODAL PARA CREAR / EDITAR HERRAMIENTA
             ================================================================== -->
        <div id="modalHerramienta" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitulo">Nueva Herramienta</h2>
                    <button class="btn-close" onclick="cerrarModal()">×</button>
                </div>
                <form id="formHerramienta" onsubmit="guardarHerramienta(event)">
                    <input type="hidden" id="herr_id">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="herr_nombre" required>
                    </div>
                    <div class="form-group">
                        <label>Código Interno</label>
                        <input type="text" id="herr_cod_int">
                    </div>
                    <div class="form-group">
                        <label>Tipo</label>
                        <input type="text" id="herr_tipo" value="General">
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select id="herr_estado">
                            <option value="disponible">Disponible</option>
                            <option value="en_uso">En Uso</option>
                            <option value="en_reparacion">En Reparación</option>
                            <option value="no_disponible">No Disponible</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ubicación</label>
                        <input type="text" id="herr_ubicacion" value="Taller">
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="../../Js/app.js"></script>
    <!-- Controlador específico de Herramientas -->
    <script src="../../Js/herramientas.js"></script>
</body>

</html>
