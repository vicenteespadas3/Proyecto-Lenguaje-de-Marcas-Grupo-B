<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Piezas de Repuesto - ERP Mecatrónica</title>
    <link rel="stylesheet" href="../../CSS/estilos.css">
    <link rel="stylesheet" href="../../CSS/menu.css">
</head>

<body class="theme-inventario">
    <div class="app-body">
        <main class="main-content">

            <header class="header">
                <div class="header-info">
                    <h1>Gestión de Piezas de Repuesto</h1>
                    <p>Control de existencias y recambios críticos</p>
                </div>
                <div class="header-actions" style="display: flex; gap: 10px; align-items: center;">
                    <div class="search-bar" style="display: flex; gap: 5px;">
                        <input type="text" id="busquedaPieza" placeholder="Buscar pieza..." 
                               onkeyup="filtrarPiezas()"
                               style="padding: 10px; border: 1px solid #bdc3c7; border-radius: 5px; min-width: 250px;">
                        <button class="btn btn-primary" onclick="filtrarPiezas()">Buscar</button>
                    </div>
                    <button class="btn btn-primary" onclick="abrirModalPieza()">
                        + Registrar Nueva Pieza
                    </button>
                </div>
            </header>

            <section class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th class="col-id">ID</th>
                            <th>Código Interno</th>
                            <th>Nombre</th>
                            <th>Código Proveedor</th>
                            <th>Stock</th>
                            <th>Estado</th>
                            <th class="col-acciones">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-piezas-body">
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <!-- Modal para Añadir / Editar Pieza -->
    <div id="modalPieza" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitulo">Añadir Nueva Pieza</h2>
                <button class="btn-close" onclick="cerrarModal()">×</button>
            </div>
            <div class="modal-body">
                <form id="formPieza" onsubmit="guardarPieza(event)">
                    <input type="hidden" id="piez_id">
                    
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="piez_nombre" required>
                    </div>
                    <div style="display: flex; gap: 15px;">
                        <div class="form-group" style="flex: 1;">
                            <label>Código Interno</label>
                            <input type="text" id="piez_cod_int">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>Código Proveedor</label>
                            <input type="text" id="piez_cod_prov">
                        </div>
                    </div>
                    <div style="display: flex; gap: 15px;">
                        <div class="form-group" style="flex: 1;">
                            <label>Stock Actual</label>
                            <input type="number" id="piez_stock" value="0" min="0" required>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>Stock Mínimo</label>
                            <input type="number" id="piez_stock_min" value="5" min="0" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Precio Unitario (€)</label>
                        <input type="number" id="piez_precio" value="0.00" min="0" step="0.01">
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../../Js/app.js"></script>
    <script src="../../Js/piezas.js"></script>
</body>

</html>
