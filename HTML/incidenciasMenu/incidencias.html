<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Incidencias - ERP Mecatrónica</title>
    <link rel="stylesheet" href="../../CSS/estilos.css">
    <link rel="stylesheet" href="../../CSS/menu.css">
</head>

<body class="theme-mantenimiento">
    <div class="app-body">
        <main class="main-content">
            <header class="header">
                <div class="header-info">
                    <h1>Órdenes de Trabajo (OT)</h1>
                    <p>Listado de incidencias y averías reportadas en planta.</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="nuevaIncidencia()">
                        + Reportar Incidencia
                    </button>
                </div>
            </header>

            <section class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID Orden</th>
                            <th>Máquina</th>
                            <th>Apertura</th>
                            <th>Prioridad</th>
                            <th>Descripción</th>
                            <th>Técnico</th>
                            <th>Estado</th>
                            <th class="col-acciones">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-incidencias-body">
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="../../Js/app.js"></script>
    <script>
        async function cargarIncidencias() {
            const tbody = document.getElementById('tabla-incidencias-body');
            tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 20px;">Cargando incidencias... ⚙️</td></tr>';

            const res = await api('GET', '../../api/incidencias/incidencias.php');

            if (res && res.incidencias) {
                tbody.innerHTML = '';
                if (res.incidencias.length > 0) {
                    res.incidencias.forEach(i => {
                        const pClass = i.prioridad === 'ALTA' ? 'danger' : (i.prioridad === 'MEDIA' ? 'warning' : 'success');
                        const sClass = i.estado === 'Abierto' ? 'danger' : 'warning';

                        tbody.innerHTML += `
                            <tr>
                                <td><strong>${i.id_orden}</strong></td>
                                <td>${i.id_maquina}</td>
                                <td>${i.fecha_apertura}</td>
                                <td><span class="status-badge ${pClass}">${i.prioridad}</span></td>
                                <td>${i.descripcion}</td>
                                <td>${i.tecnico_asignado || 'Sin asignar'}</td>
                                <td><span class="status-badge ${sClass}">${i.estado}</span></td>
                                <td class="action-buttons">
                                    <button class="btn-icon" onclick="ver(${i.id_orden})">👁️</button>
                                </td>
                            </tr>`;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">No hay incidencias.</td></tr>';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderMenu();
            cargarIncidencias();
        });
    </script>
</body>

</html>
