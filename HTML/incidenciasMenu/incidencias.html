<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Incidencias - ERP Mecatrónica</title>
    <link rel="stylesheet" href="../../CSS/estilos.css">
    <link rel="stylesheet" href="../../CSS/menu.css">
</head>

<body class="theme-incidencias">
    <div class="app-body">
        <main class="main-content">
            <header class="header">
                <div class="header-info">
                    <h1>Órdenes de Trabajo (OT)</h1>
                    <p>Listado de incidencias y averías reportadas en planta.</p>
                </div>
                <div class="header-actions" style="display: flex; gap: 10px; align-items: center;">
                    <input type="text" id="inputBuscarIncidencia" placeholder="Buscar incidencia..." class="form-control" style="padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
                    <button class="btn btn-secondary" id="btnBuscarIncidencia">🔍 Buscar</button>
                    <button class="btn btn-primary" onclick="nuevaIncidencia()">
                        + Reportar Incidencia
                    </button>
                </div>
            </header>

            <section class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID Orden</th>
                            <th>Máquina</th>
                            <th>Apertura</th>
                            <th>Prioridad</th>
                            <th>Descripción</th>
                            <th>Técnico</th>
                            <th>Estado</th>
                            <th class="col-acciones">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-incidencias-body">
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="../../Js/app.js"></script>
    <script src="../../Js/incidencias.js"></script>
</body>

</html>
