<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Incidencias - ERP Mecatrónica</title>
    <link rel="stylesheet" href="../../CSS/estilos.css">
    <link rel="stylesheet" href="../../CSS/menu.css">
</head>

<body class="theme-mantenimiento">
    <div class="app-body">
        <main class="main-content">            <header class="header">
                <div class="header-info">
                    <h1>Gestión de Incidencias</h1>
                    <p>Reporte y seguimiento de averías en activos</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="abrirModalIncidencia()">+ Reportar Incidencia</button>
                </div>
            </header>

            <!-- Barra de Búsqueda y Filtros Avanzada -->
            <div class="search-filters-container">
                <div class="search-filters-bar">
                    <div class="search-group">
                        <div class="search-input-wrapper">
                            <input type="text" id="searchIncidencia" placeholder="Buscar por descripción, máquina o técnico...">
                        </div>
                        <button class="btn btn-primary btn-search" onclick="filtrarIncidencias()">
                            🔍 Buscar
                        </button>
                    </div>
                    <div class="filter-actions">
                        <button class="btn btn-secondary" onclick="togglePanelFiltros()">
                            ➕ Filtros
                        </button>
                        <button class="btn btn-secondary" onclick="toggleOrden()">
                            ⇅ Ordenar
                        </button>
                    </div>
                </div>

                <!-- Panel de Filtros (Expandible) -->
                <div id="panelFiltros" class="filter-panel" style="display: none;">
                    <div class="filter-grid">
                        <div class="filter-item">
                            <label>Prioridad</label>
                            <select id="filtroPrioridad" class="filter-select">
                                <option value="">Todas</option>
                                <option value="Alta">Alta</option>
                                <option value="Media">Media</option>
                                <option value="Baja">Baja</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label>Estado</label>
                            <select id="filtroEstado" class="filter-select">
                                <option value="">Todos</option>
                                <option value="abierta">Abierta</option>
                                <option value="en_curso">En Curso</option>
                                <option value="resuelta">Resuelta</option>
                                <option value="cerrada">Cerrada</option>
                            </select>
                        </div>
                    </div>
                    <div class="filter-panel-actions">
                        <button class="btn btn-secondary btn-small" onclick="limpiarFiltros()">Limpiar</button>
                        <button class="btn btn-primary btn-small" onclick="filtrarIncidencias()">Aplicar</button>
                    </div>
                </div>
                
                <div class="results-info">
                    <span id="contadorIncidencias" class="search-results-count">0 incidencias encontradas</span>
                </div>
            </div>

            <section class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Máquina</th>
                            <th>Descripción</th>
                            <th>Prioridad</th>
                            <th>Estado</th>
                            <th>Técnico</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-incidencias-body">
                    </tbody>
                </table>
            </section>
        </main>

        <!-- Modal Reportar/Editar Incidencia -->
        <div id="modalIncidencia" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTituloInc">Reportar Incidencia</h2>
                    <button class="btn-close" onclick="cerrarModalInc()">×</button>
                </div>
                <form id="formIncidencia" onsubmit="guardarIncidencia(event)">
                    <input type="hidden" id="inc_id">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Máquina (ID)</label>
                            <input type="number" id="inc_maquina" required>
                        </div>
                        <div class="form-group">
                            <label>Prioridad</label>
                            <select id="inc_prioridad">
                                <option value="Baja">Baja</option>
                                <option value="Media" selected>Media</option>
                                <option value="Alta">Alta</option>
                            </select>
                        </div>
                        <div class="form-group" style="grid-column: span 2;">
                            <label>Descripción de la avería</label>
                            <textarea id="inc_desc" required placeholder="Describe el problema detectado..."></textarea>
                        </div>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="cerrarModalInc()">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Enviar Reporte</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../../Js/app.js"></script>
    <script>
        let ordenAsc = true;
        let criterioOrden = 'id'; // Default 'id' o 'descripcion'

        async function cargarIncidencias() {
            const tbody = document.getElementById('tabla-incidencias-body');
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px;">Cargando incidencias... 🛠️</td></tr>';
            const res = await api('GET', '../../api/incidencias/incidencias.php');
            if (res && res.ok) {
                incidenciasData = res.incidencias || [];
                aplicarOrden();
                filtrarIncidencias();
            } else {
                tbody.innerHTML = '<tr><td colspan="7" class="error-msg">Error al cargar datos.</td></tr>';
            }
        }

        function togglePanelFiltros() {
            const p = document.getElementById('panelFiltros');
            p.style.display = p.style.display === 'none' ? 'block' : 'none';
        }

        function toggleOrden() {
            if (criterioOrden === 'id') {
                if (ordenAsc) {
                    ordenAsc = false;
                } else {
                    criterioOrden = 'descripcion';
                    ordenAsc = true;
                }
            } else {
                if (ordenAsc) {
                    ordenAsc = false;
                } else {
                    criterioOrden = 'id';
                    ordenAsc = true;
                }
            }
            aplicarOrden();
            filtrarIncidencias();
        }

        function aplicarOrden() {
            incidenciasData.sort((a, b) => {
                let valA, valB;
                if (criterioOrden === 'descripcion') {
                    valA = (a.descripcion || '').toLowerCase();
                    valB = (b.descripcion || '').toLowerCase();
                    return ordenAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                } else {
                    valA = parseInt(a.id_incidencia);
                    valB = parseInt(b.id_incidencia);
                    return ordenAsc ? valA - valB : valB - valA;
                }
            });
        }

        function limpiarFiltros() {
            document.getElementById('searchIncidencia').value = '';
            document.getElementById('filtroPrioridad').value = '';
            document.getElementById('filtroEstado').value = '';
            filtrarIncidencias();
        }

        function filtrarIncidencias() {
            const search = document.getElementById('searchIncidencia').value.toLowerCase().trim();
            const prioridadF = document.getElementById('filtroPrioridad').value;
            const estadoF = document.getElementById('filtroEstado').value;
            const tbody = document.getElementById('tabla-incidencias-body');

            const filtradas = incidenciasData.filter(i => {
                const matchSearch = !search || 
                    (i.descripcion || '').toLowerCase().includes(search) || 
                    (i.maquina || '').toLowerCase().includes(search) || 
                    (i.tecnico_asignado || '').toLowerCase().includes(search);
                const matchPrio = !prioridadF || i.prioridad === prioridadF;
                const matchEst = !estadoF || i.estado === estadoF;
                return matchSearch && matchPrio && matchEst;
            });

            document.getElementById('contadorIncidencias').textContent = `${filtradas.length} incidencias encontradas`;

            tbody.innerHTML = '';
            filtradas.forEach(i => {
                let pClass = 'success';
                if (i.prioridad === 'Media') pClass = 'warning';
                if (i.prioridad === 'Alta') pClass = 'danger';

                let eClass = 'info';
                if (i.estado === 'abierta') eClass = 'danger';
                if (i.estado === 'en_curso') eClass = 'warning';
                if (i.estado === 'resuelta' || i.estado === 'cerrada') eClass = 'success';

                const estTxt = i.estado.charAt(0).toUpperCase() + i.estado.slice(1).replace('_', ' ');

                tbody.innerHTML += `
                    <tr>
                        <td><strong>INC-${i.id_incidencia}</strong></td>
                        <td>${i.maquina || 'Máquina ' + i.id_maquina}</td>
                        <td>${i.descripcion}</td>
                        <td><span class="status-badge ${pClass}">${i.prioridad}</span></td>
                        <td><span class="status-badge ${eClass}">${estTxt}</span></td>
                        <td>${i.tecnico_asignado || 'Sin asignar'}</td>
                        <td class="action-buttons">
                            <button class="btn-icon" title="Gestionar" onclick="gestionarInc(${i.id_incidencia})">⚙️</button>
                            <button class="btn-icon" title="Eliminar" style="color:red;" onclick="borrarInc(${i.id_incidencia})">🗑️</button>
                        </td>
                    </tr>
                `;
            });
        }

        function abrirModalIncidencia() {
            document.getElementById('modalTituloInc').textContent = 'Reportar Incidencia';
            document.getElementById('formIncidencia').reset();
            document.getElementById('inc_id').value = '';
            document.getElementById('modalIncidencia').classList.add('show');
        }

        function cerrarModalInc() {
            document.getElementById('modalIncidencia').classList.remove('show');
        }

        async function guardarIncidencia(e) {
            e.preventDefault();
            const datos = {
                id_maquina: document.getElementById('inc_maquina').value,
                prioridad: document.getElementById('inc_prioridad').value,
                descripcion: document.getElementById('inc_desc').value
            };
            const res = await api('POST', '../../api/incidencias/incidencias.php', datos);
            if (res.ok) { cerrarModalInc(); cargarIncidencias(); }
            else alert('Error: ' + res.error);
        }

        async function gestionarInc(id) {
            alert('Lógica de gestión para INC-' + id + ' en desarrollo (abriría modal de resolución)');
        }

        async function borrarInc(id) {
            if (!confirm('¿Seguro?')) return;
            const res = await api('DELETE', '../../api/incidencias/incidencias.php', { id_incidencia: id });
            if (res.ok) cargarIncidencias();
            else alert('Error: ' + res.error);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderMenu('incidencias');
            cargarIncidencias();
        });
    </script>
</body>
</html>
