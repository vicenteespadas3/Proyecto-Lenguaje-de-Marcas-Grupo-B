<!DOCTYPE html>
<!-- ==================================================================
     HTML/perfil.html
     Perfil del usuario autenticado.
     Interactúa con api/auth/perfil.php
     ================================================================== -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Mecatrónica - Perfil</title>
    <link rel="stylesheet" href="../CSS/menu.css">
    <link rel="stylesheet" href="../CSS/estilos.css">
    <style>
        .app-body {
            /* Ensures space for the sidebar */
        }
        .perfil-container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            font-family: Arial, sans-serif;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .perfil-header {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .perfil-avatar {
            width: 80px;
            height: 80px;
            background-color: #3b82f6;
            color: white;
            font-size: 2.5em;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        }
        .perfil-info h1 {
            margin: 0;
            color: #1e293b;
            font-size: 2em;
        }
        .perfil-info p {
            margin: 5px 0 0;
            color: #7f8c8d;
            font-size: 1.1em;
        }
        .perfil-detalles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .detalle-grupo {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .detalle-grupo:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .detalle-grupo label {
            display: block;
            font-weight: bold;
            color: #64748b;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        .detalle-grupo p {
            margin: 0;
            color: #334155;
            font-size: 1.1em;
        }
        .perfil-acciones {
            margin-top: 30px;
            text-align: right;
            border-top: 2px solid #f1f5f9;
            padding-top: 20px;
        }
        .btn-editar {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-editar:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="app-body theme-administracion">
        <main class="main-content">
            <header class="header">
                <div class="header-info">
                    <h1>Mi Perfil</h1>
                    <p>Gestiona tu información personal y credenciales de acceso</p>
                </div>
            </header>

            <div class="perfil-container">
                <!-- Cabecera del perfil -->
                <div class="perfil-header">
                    <div class="perfil-avatar" id="perf-avatar">?</div>
                    <div class="perfil-info">
                        <h1 id="perf-nombre-completo">Cargando...</h1>
                        <p id="perf-rol" class="status-badge info" style="display:inline-block; margin-top:5px;">Puesto / Rol</p>
                    </div>
                </div>
                
                <!-- Detalles del perfil -->
                <div class="perfil-detalles">
                    <div class="detalle-grupo">
                        <label>Nombre</label>
                        <p id="perf-nombre">-</p>
                    </div>
                    <div class="detalle-grupo">
                        <label>Apellidos</label>
                        <p id="perf-apellidos">-</p>
                    </div>
                    <div class="detalle-grupo">
                        <label>Correo Electrónico</label>
                        <p id="perf-email" style="font-weight: bold; color: var(--primary);">-</p>
                    </div>
                    <div class="detalle-grupo">
                        <label>Rol en el Sistema</label>
                        <p id="perf-rol-detalle" style="text-transform: uppercase; font-size: 0.9em; letter-spacing: 1px;">-</p>
                    </div>
                    <div class="detalle-grupo">
                        <label>Fecha de Registro</label>
                        <p id="perf-registro">-</p>
                    </div>
                    <div class="detalle-grupo">
                        <label>Último Acceso</label>
                        <p id="perf-acceso">-</p>
                    </div>
                </div>

                <div class="perfil-acciones">
                    <button class="btn btn-primary" onclick="abrirModalPerfil()">✏️ Editar Perfil</button>
                </div>
            </div>
        </main>
    </div>

    <!-- ==================================================================
         MODAL PARA EDITAR PERFIL
         ================================================================== -->
    <div id="modalPerfil" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Editar Mi Perfil</h2>
                <button class="btn-close" onclick="cerrarModalPerfil()">&times;</button>
            </div>
            <form id="formPerfil" onsubmit="guardarPerfil(event)">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="editNombre" required>
                </div>
                <div class="form-group">
                    <label>Apellidos</label>
                    <input type="text" id="editApellidos">
                </div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="editEmail" required>
                </div>
                <div class="form-group">
                    <label>Nueva Contraseña (dejar en blanco para no cambiar)</label>
                    <input type="password" id="editPassword" placeholder="Mínimo 4 caracteres si cambias">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="cerrarModalPerfil()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../Js/app.js"></script>
    <script>
        let userData = null;

        async function cargarPerfil() {
            const res = await api('GET', '../api/auth/perfil.php');
            if (res && res.usuario) {
                userData = res.usuario;
                renderPerfil();
            } else {
                console.error('Error al cargar perfil:', res);
            }
        }

        function renderPerfil() {
            const u = userData;
            const letra = u.nombre ? u.nombre[0].toUpperCase() : u.email[0].toUpperCase();
            document.getElementById('perf-avatar').textContent = letra;
            document.getElementById('perf-nombre-completo').textContent = `${u.nombre} ${u.apellidos}`.trim();
            document.getElementById('perf-rol').textContent = u.rol.charAt(0).toUpperCase() + u.rol.slice(1);
            
            document.getElementById('perf-nombre').textContent = u.nombre || '-';
            document.getElementById('perf-apellidos').textContent = u.apellidos || '-';
            document.getElementById('perf-email').textContent = u.email;
            document.getElementById('perf-rol-detalle').textContent = u.rol.toUpperCase();
            document.getElementById('perf-registro').textContent = u.fecha_creacion || 'N/A';
            document.getElementById('perf-acceso').textContent = u.ultimo_acceso || 'Ahora mismo';
        }

        function abrirModalPerfil() {
            if (!userData) return;
            document.getElementById('editNombre').value = userData.nombre || '';
            document.getElementById('editApellidos').value = userData.apellidos || '';
            document.getElementById('editEmail').value = userData.email || '';
            document.getElementById('editPassword').value = '';
            document.getElementById('modalPerfil').classList.add('show');
        }

        function cerrarModalPerfil() {
            document.getElementById('modalPerfil').classList.remove('show');
        }

        async function guardarPerfil(e) {
            e.preventDefault();
            const payload = {
                nombre: document.getElementById('editNombre').value,
                apellidos: document.getElementById('editApellidos').value,
                email: document.getElementById('editEmail').value,
                password: document.getElementById('editPassword').value
            };

            const res = await api('PUT', '../api/auth/perfil.php', payload);
            if (res && res.ok) {
                alert(res.msg || 'Perfil actualizado correctamente.');
                cerrarModalPerfil();
                await cargarPerfil(); 
                // Recargamos para que el topbar se actualice
                location.reload();
            } else {
                alert('Error: ' + (res.error || 'No se pudo actualizar el perfil.'));
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderMenu('perfil'); 
            cargarPerfil();
        });
    </script>
</body>
</html>
