<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Gamas - ERP</title>
    
    <link rel="stylesheet" href="/CSS/estilos.css">
</head>
<body>

    <main class="main-content">

            <div class="header-info">
                <h1>Gestión de Gamas</h1>
                <p>Configuración de los tipos de mantenimiento preventivos y correctivos.</p>
            </div>
            <button class="btn btn-primary" id="btnNuevaGama">➕ Nueva Gama</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="col-id">ID</th>
                        <th>Nombre</th>
                        <th>Tipo Mantenimiento</th>
                        <th>Tipo Gama</th>

                    </tr>
                </thead>
                <tbody id="cuerpoTablaGamas">
                    <tr><td colspan="5" style="text-align: center;">Cargando datos desde la base de datos...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="../../Js/app.js"></script>
    <script src="../../Js/gamas.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderMenu(); 
        });
    </script>

</html>
