<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GMAO - Directorio de Proveedores</title>
    <link rel="stylesheet" href="../../CSS/estilos.css">
    <link rel="stylesheet" href="../../CSS/menu.css">
</head>
<body>
    <div class="app-body theme-activos">
        <main class="main-content">
            <header class="header">
                <div class="header-info">
                    <h1>Directorio de Proveedores</h1>
                    <p>Gestión de empresas suministradoras y contactos técnicos</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="nuevoProveedor()">+ Nuevo Proveedor</button>
                </div>
            </header>

            <!-- Barra de Búsqueda y Filtros Avanzada -->
            <div class="search-filters-container">
                <div class="search-filters-bar">
                    <div class="search-group">
                        <div class="search-input-wrapper">
                            <input type="text" id="searchProveedor" placeholder="Buscar por empresa, contacto, email...">
                        </div>
                        <button class="btn btn-primary btn-search" onclick="filtrarProveedores()">
                            🔍 Buscar
                        </button>
                    </div>
                    <div class="filter-actions">
                        <button class="btn btn-secondary" onclick="togglePanelFiltros()">
                            ➕ Filtros
                        </button>
                        <div class="dropdown-ordenar-container">
                            <button class="btn btn-secondary" onclick="toggleDropdownOrden(event)">
                                ⇅ Ordenar
                            </button>
                            <div id="dropdownOrden" class="dropdown-orden-content">
                                <div class="dropdown-orden-item" onclick="cambiarCriterioOrden('id')">
                                    <span>ID Proveedor</span>
                                    <span class="check-icon"></span>
                                </div>
                                <div class="dropdown-orden-item" onclick="cambiarCriterioOrden('empresa')">
                                    <span>Nombre Empresa</span>
                                    <span class="check-icon"></span>
                                </div>
                                <div class="dropdown-orden-item" onclick="cambiarCriterioOrden('contacto')">
                                    <span>Persona Contacto</span>
                                    <span class="check-icon"></span>
                                </div>
                                <div class="dropdown-orden-item" onclick="cambiarCriterioOrden('equipos')">
                                    <span>Especialidad</span>
                                    <span class="check-icon"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Panel de Filtros (Expandible) -->
                <div id="panelFiltros" class="filter-panel" style="display: none;">
                    <div class="filter-grid">
                        <div class="filter-item">
                            <label>Especialidad</label>
                            <input type="text" id="filtroEquipos" placeholder="Ej: Tornillería">
                        </div>
                    </div>
                    <div class="filter-panel-actions">
                        <button class="btn btn-secondary btn-small" onclick="limpiarFiltros()">Limpiar</button>
                        <button class="btn btn-primary btn-small" onclick="filtrarProveedores()">Aplicar</button>
                    </div>
                </div>
                
                <div class="results-info">
                    <span id="contadorProveedores" class="search-results-count">0 proveedores encontrados</span>
                </div>
            </div>

            <section class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Empresa / Suministrador</th>
                            <th>Contacto</th>
                            <th>Teléfono / Email</th>
                            <th>Especialidad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-proveedores-body">
                    </tbody>
                </table>
            </section>
        </main>

        <!-- Modal Proveedor -->
        <div id="modalProveedor" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTituloProv">Nuevo Proveedor</h2>
                    <button class="btn-close" onclick="cerrarModalProv()">×</button>
                </div>
                <form id="formProveedor" onsubmit="guardarProveedor(event)">
                    <input type="hidden" id="prov_id">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Nombre de Empresa</label>
                            <input type="text" id="prov_empresa" required placeholder="Nombre legal">
                        </div>
                        <div class="form-group">
                            <label>Persona de Contacto</label>
                            <input type="text" id="prov_contacto" placeholder="Nombre completo">
                        </div>
                        <div class="form-group">
                            <label>Teléfono</label>
                            <input type="text" id="prov_telefono" placeholder="+34 000 000 000">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="prov_email" placeholder="contacto@empresa.com">
                        </div>
                        <div class="form-group" style="grid-column: span 2;">
                            <label>Especialidad / Equipos</label>
                            <input type="text" id="prov_equipos" placeholder="Ej: Tornillería, Componentes Eléctricos...">
                        </div>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="cerrarModalProv()">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Proveedor</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../../Js/app.js"></script>
    <script src="../../Js/proveedores.js"></script>
</body>
</html>
