<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GMAO - Directorio de Proveedores</title>
    <link rel="stylesheet" href="../../CSS/estilos.css">
    <link rel="stylesheet" href="../../CSS/menu.css">
</head>
<body>
    <div class="app-body theme-activos">
        <main class="main-content">
        <header class="header">
            <div class="header-info">
                <h1>Directorio de Proveedores</h1>
                <p>Gestión de empresas suministradoras y contactos técnicos</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="nuevoProveedor()">+ Nuevo Proveedor</button>
            </div>
        </header>

        <!-- Barra de Búsqueda y Filtros -->
        <div class="search-filters-bar">
            <div class="search-input-wrapper">
                <input type="text" id="searchProveedor" placeholder="Buscar por empresa, contacto, teléfono o email..." oninput="filtrarProveedores()">
            </div>
            <span id="contadorProveedores" class="search-results-count">0 resultados</span>
        </div>

        <section class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Empresa</th>
                        <th>Contacto</th>
                        <th>Teléfono / Email</th>
                        <th>Equipos</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-proveedores-body">
                    </tbody>
            </table>
        </section>
        </main>

        <!-- Modal Proveedor -->
        <div id="modalProveedor" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTituloProv">Nuevo Proveedor</h2>
                    <button class="btn-close" onclick="cerrarModalProv()">×</button>
                </div>
                <form id="formProveedor" onsubmit="guardarProveedor(event)">
                    <input type="hidden" id="prov_id">
                    <div class="form-group">
                        <label>Nombre de Empresa</label>
                        <input type="text" id="prov_empresa" required>
                    </div>
                    <div class="form-group">
                        <label>Persona de Contacto</label>
                        <input type="text" id="prov_contacto">
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" id="prov_telefono">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="prov_email">
                    </div>
                    <div class="form-group">
                        <label>Especialidad / Equipos</label>
                        <input type="text" id="prov_equipos" placeholder="Ej: Tornillería, Componentes Eléctricos...">
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="cerrarModalProv()">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../../Js/app.js"></script>
    <script>
        let proveedoresData = [];

        async function cargarProveedores() {
            const tbody = document.getElementById('tabla-proveedores-body');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px;">Cargando proveedores desde la Base de Datos... 🚚</td></tr>';
            
            const res = await api('GET', '../../api/activos/proveedores.php');
            
            if (res && res.ok) {
                proveedoresData = res.proveedores || [];
                filtrarProveedores(); // Delegamos el renderizado al filtro
            } else {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 20px; color: #e74c3c;">
                    <strong>⚠️ Error al conectar con la base de datos:</strong><br> ${res.error || 'Verifica que el servidor Ubuntu esté encendido.'}
                </td></tr>`;
            }
        }

        // ── Función de filtrado en cliente ──
        function filtrarProveedores() {
            const texto = document.getElementById('searchProveedor').value.toLowerCase().trim();
            const tbody = document.getElementById('tabla-proveedores-body');

            const filtrados = proveedoresData.filter(prov => {
                const empresa = (prov.empresa || '').toLowerCase();
                const contacto = (prov.contacto || '').toLowerCase();
                const telefono = (prov.telefono || '').toLowerCase();
                const email = (prov.email || '').toLowerCase();
                const equipos = (prov.equipos || '').toLowerCase();
                const id = String(prov.id_proveedor || '');

                return !texto || empresa.includes(texto) || contacto.includes(texto) || telefono.includes(texto) || email.includes(texto) || equipos.includes(texto) || id.includes(texto);
            });

            document.getElementById('contadorProveedores').textContent = filtrados.length + ' resultado' + (filtrados.length !== 1 ? 's' : '');

            tbody.innerHTML = '';
            if (filtrados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px; color: #7f8c8d;">No se encontraron proveedores con esos criterios.</td></tr>';
                return;
            }
            filtrados.forEach(prov => {
                const id = prov.id_proveedor;
                const empresa = prov.empresa;
                const contacto = prov.contacto || '-';
                const email = prov.email || '';
                const telefono = prov.telefono || '';
                const telEmail = (telefono && email) ? `${telefono} <br> <small>${email}</small>` : (telefono || email || '-');
                const equipos = prov.equipos || 'Variados';
                
                tbody.innerHTML += `
                    <tr>
                        <td><strong>PRV-${id}</strong></td>
                        <td>${empresa}</td>
                        <td>${contacto}</td>
                        <td>${telEmail}</td>
                        <td>${equipos}</td>
                        <td class="action-buttons">
                            <button class="btn-icon" title="Editar" onclick="editarProveedor(${id})">✏️</button>
                            <button class="btn-icon" title="Eliminar" style="color: #e74c3c;" onclick="borrarProveedor(${id})">🗑️</button>
                        </td>
                    </tr>
                `;
            });
        }

        function nuevoProveedor() {
            document.getElementById('modalTituloProv').textContent = 'Nuevo Proveedor';
            document.getElementById('formProveedor').reset();
            document.getElementById('prov_id').value = '';
            document.getElementById('modalProveedor').classList.add('show');
        }

        function editarProveedor(id) {
            const p = proveedoresData.find(x => x.id_proveedor == id);
            if (!p) return;

            document.getElementById('modalTituloProv').textContent = 'Editar Proveedor';
            document.getElementById('prov_id').value = p.id_proveedor;
            document.getElementById('prov_empresa').value = p.empresa || '';
            document.getElementById('prov_contacto').value = p.contacto || '';
            document.getElementById('prov_telefono').value = p.telefono || '';
            document.getElementById('prov_email').value = p.email || '';
            document.getElementById('prov_equipos').value = p.equipos || '';

            document.getElementById('modalProveedor').classList.add('show');
        }

        function cerrarModalProv() {
            document.getElementById('modalProveedor').classList.remove('show');
        }

        async function guardarProveedor(e) {
            e.preventDefault();
            const id = document.getElementById('prov_id').value;
            const datos = {
                empresa: document.getElementById('prov_empresa').value,
                contacto: document.getElementById('prov_contacto').value,
                telefono: document.getElementById('prov_telefono').value,
                email: document.getElementById('prov_email').value,
                equipos: document.getElementById('prov_equipos').value
            };

            const metodo = id ? 'PUT' : 'POST';
            if (id) datos.id_proveedor = id;

            const res = await api(metodo, '../../api/activos/proveedores.php', datos);
            if (res.ok) {
                cerrarModalProv();
                cargarProveedores();
            } else {
                alert('Error: ' + res.error);
            }
        }

        async function borrarProveedor(id) {
            if (confirm('¿Estás seguro de eliminar este proveedor?')) {
                const res = await api('DELETE', '../../api/activos/proveedores.php', { id_proveedor: id });
                if (res.ok) {
                    cargarProveedores();
                } else {
                    alert('Error: ' + res.error);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderMenu(); 
            cargarProveedores();
        });
    </script>
</body>
</html>
