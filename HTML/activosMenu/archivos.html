<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GMAO - Gestor de Archivos</title>
    <link rel="stylesheet" href="../../CSS/estilos.css">
    <link rel="stylesheet" href="../../CSS/menu.css">
</head>
<body>
    <div class="app-body theme-activos">
        <main class="main-content">
            <header class="header">
                <div class="header-info">
                    <h1>Gestor de Documentación</h1>
                    <p>Planos, manuales y certificados vinculados a activos</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="subirArchivo()">📁 Subir Archivo</button>
                </div>
            </header>

            <!-- Barra de Búsqueda y Filtros -->
            <div class="search-filters-bar">
                <div class="search-input-wrapper">
                    <input type="text" id="searchArchivo" placeholder="Buscar por nombre, máquina o ID..." oninput="filtrarArchivos()">
                </div>
                <select id="filtroTipo" class="filter-select" onchange="filtrarArchivos()">
                    <option value="">Todos los tipos</option>
                    <option value="PDF">PDF</option>
                    <option value="Imagen">Imagen</option>
                    <option value="Manual">Manual</option>
                    <option value="Otro">Otro</option>
                </select>
                <span id="contadorArchivos" class="search-results-count">0 resultados</span>
            </div>

            <section class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Doc. ID</th>
                            <th>Nombre Archivo</th>
                            <th>Tipo</th>
                            <th>Vínculo (Máquina)</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-archivos-body">
                    </tbody>
                </table>
            </section>
        </main>

        <!-- Modal Archivo -->
        <div id="modalArchivo" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTituloArch">Subir Archivo</h2>
                    <button class="btn-close" onclick="cerrarModalArch()">×</button>
                </div>
                <form id="formArchivo" onsubmit="guardarArchivo(event)">
                    <input type="hidden" id="arch_id">
                    <div class="form-group">
                        <label>Nombre del Documento</label>
                        <input type="text" id="arch_nombre" required>
                    </div>
                    <div class="form-group">
                        <label>Tipo / Extensión</label>
                        <select id="arch_tipo">
                            <option value="PDF">PDF</option>
                            <option value="Imagen">Imagen</option>
                            <option value="Manual">Manual</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Vincular a Máquina (ID)</label>
                        <input type="number" id="arch_maquina" placeholder="ID de Máquina (Opcional)">
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="cerrarModalArch()">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../../Js/app.js"></script>
    <script>
        let archivosData = [];

        async function cargarArchivos() {
            const tbody = document.getElementById('tabla-archivos-body');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px;">Cargando archivos desde la Base de Datos... 📁</td></tr>';
            
            const res = await api('GET', '../../api/activos/archivos.php');
            
            if (res && res.ok) {
                archivosData = res.archivos || [];
                filtrarArchivos(); // Delegamos el renderizado al filtro
            } else {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 20px; color: #e74c3c;">
                    <strong>⚠️ Error al conectar con la base de datos:</strong><br> ${res.error || 'Verifica que el servidor Ubuntu esté encendido.'}
                </td></tr>`;
            }
        }

        // ── Función de filtrado en cliente ──
        function filtrarArchivos() {
            const texto = document.getElementById('searchArchivo').value.toLowerCase().trim();
            const tipoFiltro = document.getElementById('filtroTipo').value;
            const tbody = document.getElementById('tabla-archivos-body');

            const filtrados = archivosData.filter(doc => {
                const nombre = (doc.nombre_archivo || '').toLowerCase();
                const tipo = doc.tipo || '';
                const vinculo = (doc.maquina || '').toLowerCase();
                const id = String(doc.id_archivo || '');

                const coincideTexto = !texto || nombre.includes(texto) || vinculo.includes(texto) || id.includes(texto);
                const coincideTipo = !tipoFiltro || tipo === tipoFiltro;
                return coincideTexto && coincideTipo;
            });

            document.getElementById('contadorArchivos').textContent = filtrados.length + ' resultado' + (filtrados.length !== 1 ? 's' : '');

            tbody.innerHTML = '';
            if (filtrados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px; color: #7f8c8d;">No se encontraron archivos con esos criterios.</td></tr>';
                return;
            }
            filtrados.forEach(doc => {
                const id = doc.id_archivo;
                const nombre = doc.nombre_archivo;
                const tipo = doc.tipo || 'PDF';
                const vinculo = doc.maquina || (doc.id_maquina ? `Máquina ${doc.id_maquina}` : 'General');
                
                let fecha = doc.fecha_subida || '';
                if(fecha.includes(' ')) fecha = fecha.split(' ')[0];

                tbody.innerHTML += `
                    <tr>
                        <td><strong>DOC-${id}</strong></td>
                        <td>${nombre}</td>
                        <td><span class="status-badge" style="background:#34495e; color:white;">${tipo}</span></td>
                        <td>${vinculo}</td>
                        <td>${fecha}</td>
                        <td class="action-buttons">
                            <button class="btn-icon" title="Editar" onclick="editarArchivo(${id})">✏️</button>
                            <button class="btn-icon" title="Eliminar" style="color: #e74c3c;" onclick="eliminarArchivo(${id})">🗑️</button>
                        </td>
                    </tr>
                `;
            });
        }

        function subirArchivo() {
            document.getElementById('modalTituloArch').textContent = 'Subir Archivo';
            document.getElementById('formArchivo').reset();
            document.getElementById('arch_id').value = '';
            document.getElementById('modalArchivo').classList.add('show');
        }

        function editarArchivo(id) {
            const a = archivosData.find(x => x.id_archivo == id);
            if (!a) return;

            document.getElementById('modalTituloArch').textContent = 'Editar Archivo';
            document.getElementById('arch_id').value = a.id_archivo;
            document.getElementById('arch_nombre').value = a.nombre_archivo || '';
            document.getElementById('arch_tipo').value = a.tipo || 'PDF';
            document.getElementById('arch_maquina').value = a.id_maquina || '';

            document.getElementById('modalArchivo').classList.add('show');
        }

        function cerrarModalArch() {
            document.getElementById('modalArchivo').classList.remove('show');
        }

        async function guardarArchivo(e) {
            e.preventDefault();
            const id = document.getElementById('arch_id').value;
            const datos = {
                nombre_archivo: document.getElementById('arch_nombre').value,
                tipo: document.getElementById('arch_tipo').value,
                id_maquina: document.getElementById('arch_maquina').value || null
            };

            const metodo = id ? 'PUT' : 'POST';
            if (id) datos.id_archivo = id;

            const res = await api(metodo, '../../api/activos/archivos.php', datos);
            if (res.ok) {
                cerrarModalArch();
                cargarArchivos();
            } else {
                alert('Error: ' + res.error);
            }
        }

        async function eliminarArchivo(id) {
            if (confirm('¿Estás seguro de eliminar este archivo?')) {
                const res = await api('DELETE', '../../api/activos/archivos.php', { id_archivo: id });
                if (res.ok) {
                    cargarArchivos();
                } else {
                    alert('Error: ' + res.error);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderMenu();
            cargarArchivos();
        });
    </script>
    <!-- Si tenías lógica extra en archivos.js, seguirá cargando aquí -->
    <script src="../../Js/archivos.js"></script>
</body>
</html>
