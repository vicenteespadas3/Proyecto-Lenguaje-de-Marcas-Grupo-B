<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GMAO - Gestor de Archivos</title>
    <link rel="stylesheet" href="../../CSS/estilos.css">
    <link rel="stylesheet" href="../../CSS/menu.css">
</head>
<body>
    <div class="app-body theme-activos">
        <main class="main-content">
            <header class="header">
                <div class="header-info">
                    <h1>Gestor de Documentación</h1>
                    <p>Planos, manuales y certificados vinculados a activos</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="subirArchivo()">📁 Subir Archivo</button>
                </div>
            </header>

            <section class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Doc. ID</th>
                            <th>Nombre Archivo</th>
                            <th>Tipo</th>
                            <th>Vínculo (Máquina)</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-archivos-body">
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="../../Js/app.js"></script>
    <script>
        async function cargarArchivos() {
            const tbody = document.getElementById('tabla-archivos-body');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px;">Cargando archivos desde la Base de Datos... 📁</td></tr>';
            
            const res = await api('GET', '../../api/activos/archivos.php');
            
            if (res && res.ok) {
                tbody.innerHTML = '';
                if (res.archivos && res.archivos.length > 0) {
                    res.archivos.forEach(doc => {
                        const id = doc.id_archivo || doc.id || 'N/A';
                        const nombre = doc.nombre_archivo || doc.nombre || 'Documento sin nombre';
                        const tipo = doc.tipo || doc.extension || 'PDF';
                        const vinculo = doc.maquina || doc.id_maquina || 'General';
                        const fecha = doc.fecha_subida || doc.fecha || '01/01/2026';
                        
                        tbody.innerHTML += `
                            <tr>
                                <td><strong>DOC-${id}</strong></td>
                                <td>${nombre}</td>
                                <td><span class="status-badge" style="background:#34495e; color:white;">${tipo}</span></td>
                                <td>${vinculo}</td>
                                <td>${fecha}</td>
                                <td class="action-buttons">
                                    <button class="btn-icon" title="Descargar" onclick="descargarArchivo(${id})">⬇️</button>
                                    <button class="btn-icon" title="Eliminar" onclick="eliminarArchivo(${id})">🗑️</button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px; color: #7f8c8d;">No hay archivos subidos en la base de datos.</td></tr>';
                }
            } else {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 20px; color: #e74c3c;">
                    <strong>⚠️ Error al conectar con la base de datos:</strong><br> ${res.error || 'Verifica que el servidor Ubuntu esté encendido.'}
                </td></tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderMenu();
            cargarArchivos();
        });
    </script>
    <!-- Si tenías lógica extra en archivos.js, seguirá cargando aquí -->
    <script src="../../Js/archivos.js"></script>
</body>
</html>
