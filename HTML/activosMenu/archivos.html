<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GMAO - Gestor de Archivos</title>
    <link rel="stylesheet" href="../../CSS/estilos.css">
    <link rel="stylesheet" href="../../CSS/menu.css">
</head>
<body>
    <div class="app-body theme-activos">
        <main class="main-content">
            <header class="header">
                <div class="header-info">
                    <h1>Gestor de Documentación</h1>
                    <p>Planos, manuales y certificados vinculados a activos</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="subirArchivo()">📁 Subir Archivo</button>
                </div>
            </header>

            <!-- Barra de Búsqueda y Filtros Avanzada -->
            <div class="search-filters-container">
                <div class="search-filters-bar">
                    <div class="search-group">
                        <div class="search-input-wrapper">
                            <input type="text" id="searchArchivo" placeholder="Buscar por nombre, máquina o ID...">
                        </div>
                        <button class="btn btn-primary btn-search" onclick="filtrarArchivos()">
                            🔍 Buscar
                        </button>
                    </div>
                    <div class="filter-actions">
                        <button class="btn btn-secondary" onclick="togglePanelFiltros()">
                            ➕ Filtros
                        </button>
                        <div class="dropdown-ordenar-container">
                            <button class="btn btn-secondary" onclick="toggleDropdownOrden(event)">
                                ⇅ Ordenar
                            </button>
                            <div id="dropdownOrden" class="dropdown-orden-content">
                                <div class="dropdown-orden-item" onclick="cambiarCriterioOrden('id')">
                                    <span>ID Documento</span>
                                    <span class="check-icon"></span>
                                </div>
                                <div class="dropdown-orden-item" onclick="cambiarCriterioOrden('nombre')">
                                    <span>Nombre Archivo</span>
                                    <span class="check-icon"></span>
                                </div>
                                <div class="dropdown-orden-item" onclick="cambiarCriterioOrden('tipo')">
                                    <span>Tipo</span>
                                    <span class="check-icon"></span>
                                </div>
                                <div class="dropdown-orden-item" onclick="cambiarCriterioOrden('fecha')">
                                    <span>Fecha</span>
                                    <span class="check-icon"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Panel de Filtros (Expandible) -->
                <div id="panelFiltros" class="filter-panel" style="display: none;">
                    <div class="filter-grid">
                        <div class="filter-item">
                            <label>Tipo de Documento</label>
                            <select id="filtroTipo" class="filter-select">
                                <option value="">Todos los tipos</option>
                                <option value="PDF">PDF</option>
                                <option value="Imagen">Imagen</option>
                                <option value="Manual">Manual</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                    </div>
                    <div class="filter-panel-actions">
                        <button class="btn btn-secondary btn-small" onclick="limpiarFiltros()">Limpiar</button>
                        <button class="btn btn-primary btn-small" onclick="filtrarArchivos()">Aplicar</button>
                    </div>
                </div>
                
                <div class="results-info">
                    <span id="contadorArchivos" class="search-results-count">0 archivos encontrados</span>
                </div>
            </div>

            <section class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Doc. ID</th>
                            <th>Nombre Archivo</th>
                            <th>Tipo</th>
                            <th>Vínculo (Máquina)</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-archivos-body">
                    </tbody>
                </table>
            </section>
        </main>

        <!-- Modal Archivo -->
        <div id="modalArchivo" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTituloArch">Subir Archivo</h2>
                    <button class="btn-close" onclick="cerrarModalArch()">×</button>
                </div>
                <form id="formArchivo" onsubmit="guardarArchivo(event)">
                    <input type="hidden" id="arch_id">
                    <div class="form-grid">
                        <div class="form-group" style="grid-column: span 2;">
                            <label>Nombre del Documento</label>
                            <input type="text" id="arch_nombre" required placeholder="Ej: Manual de Usuario - Torno Alpha">
                        </div>
                        <div class="form-group">
                            <label>Tipo / Extensión</label>
                            <select id="arch_tipo">
                                <option value="PDF">PDF</option>
                                <option value="Imagen">Imagen</option>
                                <option value="Manual">Manual</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Vincular a Máquina (ID)</label>
                            <input type="number" id="arch_maquina" placeholder="ID de Máquina (Opcional)">
                        </div>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="cerrarModalArch()">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Documento</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../../Js/app.js"></script>
    <script src="../../Js/archivos.js"></script>
</body>
</html>
