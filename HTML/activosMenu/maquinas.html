<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gamas de Mantenimiento</title>
    <link rel="stylesheet" href="../../CSS/estilos.css">
    <link rel="stylesheet" href="../../CSS/menu.css">
</head>

<body>
    <div class="app-body theme-activos">
        <main class="main-content">

            <header class="header">
                <div class="header-info">
                    <h1>Panel de Maquinaria</h1>
                    <p>Gestión de inventario técnico y activos</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="abrirModalAlta()">
                        + Añadir Nueva Máquina
                    </button>
                </div>
            </header>

            <!-- Barra de Búsqueda y Filtros Avanzada -->
            <div class="search-filters-container">
                <div class="search-filters-bar">
                    <div class="search-group">
                        <div class="search-input-wrapper">
                            <input type="text" id="searchMaquina" placeholder="Buscar por nombre, serie, fabricante...">
                        </div>
                        <button class="btn btn-primary btn-search" onclick="filtrarMaquinas()">
                            🔍 Buscar
                        </button>
                    </div>
                    <div class="filter-actions">
                        <button class="btn btn-secondary" onclick="togglePanelFiltros()">
                            ➕ Filtros
                        </button>
                        <div class="dropdown-ordenar-container">
                            <button class="btn btn-secondary" onclick="toggleDropdownOrden(event)">
                                ⇅ Ordenar
                            </button>
                            <div id="dropdownOrden" class="dropdown-orden-content">
                                <div class="dropdown-orden-item" onclick="cambiarCriterioOrden('id')">
                                    <span>ID</span>
                                    <span class="check-icon"></span>
                                </div>
                                <div class="dropdown-orden-item" onclick="cambiarCriterioOrden('nombre')">
                                    <span>Nombre</span>
                                    <span class="check-icon"></span>
                                </div>
                                <div class="dropdown-orden-item" onclick="cambiarCriterioOrden('tipo')">
                                    <span>Tipo (Alfabéticamente)</span>
                                    <span class="check-icon"></span>
                                </div>
                                <div class="dropdown-orden-item" onclick="cambiarCriterioOrden('estado')">
                                    <span>Estado (Disponibilidad)</span>
                                    <span class="check-icon"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Panel de Filtros (Expandible) -->
                <div id="panelFiltros" class="filter-panel" style="display: none;">
                    <div class="filter-grid">
                        <div class="filter-item">
                            <label>Estado</label>
                            <select id="filtroEstado" class="filter-select">
                                <option value="">Todos los estados</option>
                                <option value="disponible">Disponible</option>
                                <option value="en_mantenimiento">En Mantenimiento</option>
                                <option value="averia">Avería</option>
                                <option value="desactivada">Desactivada</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label>Ubicación</label>
                            <input type="text" id="filtroUbicacion" placeholder="Ej: Nave 1">
                        </div>
                        <div class="filter-item">
                            <label>Tipo</label>
                            <input type="text" id="filtroTipo" placeholder="Ej: Torno">
                        </div>
                    </div>
                    <div class="filter-panel-actions">
                        <button class="btn btn-secondary btn-small" onclick="limpiarFiltros()">Limpiar</button>
                        <button class="btn btn-primary btn-small" onclick="filtrarMaquinas()">Aplicar Filtros</button>
                    </div>
                </div>
                
                <div class="results-info">
                    <span id="contadorMaquinas" class="search-results-count">0 resultados encontrados</span>
                </div>
            </div>

            <section class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Equipo / Modelo</th>
                            <th>Tipo</th>
                            <th>Nº Serie</th>
                            <th>Estado</th>
                            <th>Ubicación</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-maquinas-body">
                        <!-- Se carga vía JS -->
                    </tbody>
                </table>
            </section>

        </main>

        <!-- Modal para Crear/Editar Máquina -->
        <div id="modalMaquina" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitulo">Nueva Máquina</h2>
                    <button class="btn-close" onclick="cerrarModal()">×</button>
                </div>
                <form id="formMaquina" onsubmit="guardarMaquina(event)">
                    <input type="hidden" id="maq_id">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Nombre del Equipo</label>
                            <input type="text" id="maq_nombre" required placeholder="Ej: Torno CNC Mod. Alpha">
                        </div>
                        <div class="form-group">
                            <label>Tipo</label>
                            <input type="text" id="maq_tipo" placeholder="Ej: Mecánico / Hidráulico">
                        </div>
                        <div class="form-group">
                            <label>Número de Serie</label>
                            <input type="text" id="maq_serie" placeholder="SN-XXXXXX">
                        </div>
                        <div class="form-group">
                            <label>Fabricante</label>
                            <input type="text" id="maq_fabricante" placeholder="Marca / Empresa">
                        </div>
                        <div class="form-group">
                            <label>Estado</label>
                            <select id="maq_estado">
                                <option value="disponible">Disponible</option>
                                <option value="en_mantenimiento">En Mantenimiento</option>
                                <option value="averia">Avería</option>
                                <option value="desactivada">Desactivada (Baja)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Ubicación</label>
                            <input type="text" id="maq_ubicacion" placeholder="Sección / Nave">
                        </div>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Máquina</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Modal para las Piezas (Sara) -->
        <div id="modalPiezas" class="modal-overlay">
            <div class="modal-content" style="max-width: 700px;">
                <div class="modal-header">
                    <h2 id="tituloPiezas">Piezas de la Máquina</h2>
                    <button class="btn-close" onclick="cerrarModal('modalPiezas')">×</button>
                </div>
                <table style="width: 100%; margin-top: 15px;">
                    <thead>
                        <tr>
                            <th>Pieza</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-piezas-modal-body"></tbody>
                </table>
                <div class="modal-actions" style="margin-top: 20px;">
                    <button class="btn btn-secondary" onclick="cerrarModal('modalPiezas')">Cerrar</button>
                    <button class="btn btn-primary" onclick="mostrarSeccionAnadirPieza()">+ Añadir Pieza</button>
                </div>

                <div id="seccionAnadirPieza" style="display: none; margin-top: 20px; padding-top: 15px; border-top: 1px solid #ddd;">
                    <h3 style="margin-bottom: 10px; font-size: 1.1em;">Asignar Nueva Pieza</h3>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <select id="selectNuevaPieza" style="flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
                            <option value="">Cargando piezas...</option>
                        </select>
                        <button class="btn btn-primary" onclick="asignarPiezaAMaquina()">Asignar</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="../../Js/app.js"></script>
    <script src="../../Js/maquinas.js"></script>
</body>

</html>
