<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gamas de Mantenimiento</title>
    <link rel="stylesheet" href="../../CSS/estilos.css">
    <link rel="stylesheet" href="../../CSS/menu.css">
</head>

<body>
    <div class="app-body theme-activos">
        <main class="main-content">

            <header class="header">
                <div class="header-info">
                    <h1>Panel de Maquinaria</h1>
                    <p>Gestión de inventario técnico y activos</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="abrirModalAlta()">
                        + Añadir Nueva Máquina
                    </button>
                </div>
            </header>

            <!-- Barra de Búsqueda y Filtros -->
            <div class="search-filters-bar">
                <div class="search-input-wrapper">
                    <input type="text" id="searchMaquina" placeholder="Buscar por nombre, ID o ubicación..." oninput="filtrarMaquinas()">
                </div>
                <select id="filtroEstado" class="filter-select" onchange="filtrarMaquinas()">
                    <option value="">Todos los estados</option>
                    <option value="Activa">Activa</option>
                    <option value="En Mantenimiento">En Mantenimiento</option>
                    <option value="Baja">Baja</option>
                </select>
                <span id="contadorMaquinas" class="search-results-count">0 resultados</span>
            </div>

            <section class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre del Equipo</th>
                            <th>Estado</th>
                            <th>Ubicación</th>
                            <th>Última Revisión</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-maquinas-body">
                        <tr>
                            <td><strong>MAQ-001</strong></td>
                            <td>Torno CNC Mod. Alpha</td>
                            <td><span class="status-badge success">Operativa</span></td>
                            <td>Nave 1 - Sector B</td>
                            <td>12/03/2026</td>
                            <td class="action-buttons">
                                <button class="btn-icon" title="Ver Ficha" onclick="verDetalle(1)">👁️</button>
                                <button class="btn-icon" title="Editar" onclick="editarMaquina(1)">✏️</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>

        </main>

        <!-- Modal para Crear/Editar Máquina -->
        <div id="modalMaquina" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitulo">Nueva Máquina</h2>
                    <button class="btn-close" onclick="cerrarModal()">×</button>
                </div>
                <form id="formMaquina" onsubmit="guardarMaquina(event)">
                    <input type="hidden" id="maq_id">
                    <div class="form-group">
                        <label>Nombre del Equipo</label>
                        <input type="text" id="maq_nombre" required>
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select id="maq_estado">
                            <option value="Activa">Activa</option>
                            <option value="En Mantenimiento">En Mantenimiento</option>
                            <option value="Baja">Baja</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ubicación</label>
                        <input type="text" id="maq_ubicacion">
                    </div>
                    <div class="form-group">
                        <label>Última Revisión</label>
                        <input type="date" id="maq_fecha">
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Modal para las Piezas, hecho por Sara-->
        <div id="modalPiezas" class="modal-overlay">
            <div class="modal-content" style="max-width: 700px;">
                <div class="modal-header">
                    <h2 id="tituloPiezas">Piezas de la Máquina</h2>
                    <button class="btn-close"
                        onclick="document.getElementById('modalPiezas').classList.remove('show')">×</button>
                </div>
                <table style="width: 100%; margin-top: 15px;">
                    <thead>
                        <tr>
                            <th>Pieza</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-piezas-modal-body"></tbody>
                </table>
                <div class="modal-actions" style="margin-top: 20px;">
                    <button class="btn btn-secondary"
                        onclick="document.getElementById('modalPiezas').classList.remove('show')">Cerrar</button>
                    <button class="btn btn-primary" onclick="mostrarSeccionAnadirPieza()">+ Añadir Pieza</button>
                </div>

                <!-- Sección oculta para añadir pieza -->
                <div id="seccionAnadirPieza"
                    style="display: none; margin-top: 20px; padding-top: 15px; border-top: 1px solid #ddd;">
                    <h3 style="margin-bottom: 10px; font-size: 1.1em;">Asignar Nueva Pieza</h3>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <select id="selectNuevaPieza"
                            style="flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
                            <option value="">Cargando piezas...</option>
                        </select>
                        <button class="btn btn-primary" onclick="asignarPiezaAMaquina()">Asignar</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="../../Js/app.js"></script>
    <script>
        let maquinasData = []; // Para almacenar las máquinas en memoria

        // Función para obtener las máquinas de la BD e inyectarlas en el HTML
        async function cargarMaquinas() {
            const tbody = document.getElementById('tabla-maquinas-body');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px;">Cargando máquinas desde la Base de Datos... ⚙️</td></tr>';

            const res = await api('GET', '../../api/activos/maquinas.php');

            if (res && res.ok) {
                maquinasData = res.maquinas || [];
                filtrarMaquinas(); // Delegamos el renderizado al filtro
            } else {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 20px; color: #e74c3c;">
                        <strong>⚠️ Error al conectar con la base de datos:</strong><br> ${res.error || 'Verifica que el servidor Ubuntu esté encendido.'}
                    </td></tr>`;
            }
        }
        // --- Lógica de piezas (Añadido por Sara) ---

        // Variable global para recordar qué máquina estamos viendo
        let maquinaActual = null;

        /**
         * Abre el modal de piezas para una máquina específica.
         * Hace una petición GET a la API para obtener las piezas asignadas
         * a la máquina y las muestra en una tabla dinámica.
         */
        async function abrirModalPiezas(idMaq) {
            maquinaActual = idMaq; // Guardo el ID para usarlo luego al borrar
            const tbody = document.getElementById('tabla-piezas-modal-body');
            tbody.innerHTML = '<tr><td colspan="3">Cargando piezas...</td></tr>';
            document.getElementById('modalPiezas').classList.add('show');

            // Llamo al PHP con el ID para que filtre
            const res = await api('GET', `../../api/inventario/piezas.php?id_maquina=${idMaq}`);
            if (res && res.piezas) {
                tbody.innerHTML = '';
                if (res.piezas.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3">No hay piezas asignadas.</td></tr>';
                } else {
                    res.piezas.forEach(p => {
                        // Genero la fila con el botón de borrar (la X roja)
                        tbody.innerHTML += `
                                <tr>
                                    <td>${p.nombre || p.descripcion || 'Sin nombre'}</td>
                                    <td>${p.stock_actual !== undefined ? p.stock_actual : (p.stock || 0)}</td>
                                    <td>
                                        <button class="btn-icon" style="color:red;" onclick="quitarAsignacion(${p.id_pieza})">❌</button>
                                    </td>
                                </tr>
                            `;
                    });
                }
            }
        }

        /**
         * Desvincula una pieza de la máquina actual.
         * Muestra una confirmación y, si se acepta, envía una petición DELETE a la API.
         * Tras borrarla, recarga el modal para reflejar los cambios.
         */
        async function quitarAsignacion(idPieza) {
            if (!confirm('¿Seguro que quieres quitar esta pieza de la máquina?')) return;

            // Solo necesitamos la URL con los parámetros, NO hace falta enviar un objeto extra
            const res = await api('DELETE', `../../api/inventario/piezas.php?id_maquina=${maquinaActual}&id_pieza=${idPieza}`);

            if (res.ok) {
                alert("Pieza desvinculada correctamente");
                abrirModalPiezas(maquinaActual); // Recargamos el modal para ver los cambios
            } else {
                alert('Error al quitar la pieza: ' + (res.msg || 'Desconocido'));
            }
        }

        /**
         * Muestra u oculta la sección para asignar nuevas piezas.
         * Al mostrarla, hace una petición GET para cargar todas las piezas disponibles
         * en el sistema y poner la info en el menú desplegable.
         */
        async function mostrarSeccionAnadirPieza() {
            const seccion = document.getElementById('seccionAnadirPieza');
            const select = document.getElementById('selectNuevaPieza');

            if (seccion.style.display === 'none' || seccion.style.display === '') {
                seccion.style.display = 'block';
                select.innerHTML = '<option value="">Cargando piezas disponibles...</option>';

                // Usamos pedidos_opciones.php que ya devuelve la lista de todas las piezas
                const res = await api('GET', '../../api/inventario/pedidos_opciones.php');
                if (res && res.piezas) {
                    select.innerHTML = '<option value="">-- Selecciona una pieza --</option>';
                    res.piezas.forEach(p => {
                        select.innerHTML += `<option value="${p.id_pieza}">${p.nombre} (ID: ${p.id_pieza})</option>`;
                    });
                } else {
                    select.innerHTML = '<option value="">Error al cargar piezas</option>';
                }
            } else {
                seccion.style.display = 'none';
            }
        }

        /**
         * Envía una petición POST a la API para crear la relación entre 
         * la máquina actual y la pieza seleccionada en el menú desplegable.
         * Tras la asignación, oculta el formulario y recarga el modal.
         */
        async function asignarPiezaAMaquina() {
            const select = document.getElementById('selectNuevaPieza');
            const idPieza = select.value;

            if (!idPieza) {
                alert('Por favor, selecciona una pieza de la lista.');
                return;
            }

            const datos = {
                id_maquina: maquinaActual,
                id_pieza: parseInt(idPieza)
            };

            const res = await api('POST', '../../api/inventario/piezas.php', datos);

            if (res && res.ok) {
                alert('Pieza asignada correctamente');
                document.getElementById('seccionAnadirPieza').style.display = 'none';
                select.value = '';
                abrirModalPiezas(maquinaActual); // Recargar la lista de piezas
            } else {
                alert('Error al asignar la pieza: ' + (res.error || res.msg || 'Error desconocido'));
            }
        }
        // Función para cerrar cualquier modal (el de máquinas o el mío)
        function cerrarModal(id = 'modalMaquina') {
            document.getElementById(id).classList.remove('show');
        }

        function abrirModalAlta() {
            document.getElementById('modalTitulo').textContent = 'Añadir Nueva Máquina';
            document.getElementById('formMaquina').reset();
            document.getElementById('maq_id').value = '';
            document.getElementById('modalMaquina').classList.add('show');
        }

        function editarMaquina(id) {
            const maq = maquinasData.find(m => m.id_maquina == id || m.id == id);
            if (!maq) return;

            document.getElementById('modalTitulo').textContent = 'Editar Máquina';
            document.getElementById('maq_id').value = maq.id_maquina || maq.id;
            document.getElementById('maq_nombre').value = maq.nombre || maq.descripcion || '';

            // Mapeo básico de estado al select
            let estadoOption = 'Activa';
            let st = (maq.estado || '').toLowerCase();
            if (st.includes('mant')) estadoOption = 'En Mantenimiento';
            if (st.includes('baja')) estadoOption = 'Baja';
            document.getElementById('maq_estado').value = estadoOption;

            document.getElementById('maq_ubicacion').value = maq.ubicacion || maq.sector || '';

            let fecha = maq.ultima_revision || maq.fecha_alta || '';
            if (fecha.includes(' ')) fecha = fecha.split(' ')[0];
            document.getElementById('maq_fecha').value = fecha;

            document.getElementById('modalMaquina').classList.add('show');
        }

        function cerrarModal() {
            document.getElementById('modalMaquina').classList.remove('show');
        }

        async function guardarMaquina(e) {
            e.preventDefault();

            const id = document.getElementById('maq_id').value;
            const datos = {
                nombre: document.getElementById('maq_nombre').value,
                estado: document.getElementById('maq_estado').value,
                ubicacion: document.getElementById('maq_ubicacion').value,
                ultima_revision: document.getElementById('maq_fecha').value || new Date().toISOString().split('T')[0]
            };

            let metodo = 'POST';
            if (id) {
                metodo = 'PUT';
                datos.id_maquina = id;
            }

            const res = await api(metodo, '../../api/activos/maquinas.php', datos);

            if (res.ok) {
                cerrarModal();
                cargarMaquinas(); // Recargar la tabla
            } else {
                alert('Error: ' + res.error);
            }
        }

        async function borrarMaquina(id) {
            if (confirm('¿Estás seguro de que deseas eliminar esta máquina? Esta acción no se puede deshacer.')) {
                const res = await api('DELETE', '../../api/activos/maquinas.php', { id_maquina: id });
                if (res.ok) {
                    cargarMaquinas();
                } else {
                    alert('Error al eliminar: ' + res.error);
                }
            }
        }

        // ── Función de filtrado en cliente ──
        function filtrarMaquinas() {
            const texto = document.getElementById('searchMaquina').value.toLowerCase().trim();
            const estado = document.getElementById('filtroEstado').value;
            const tbody = document.getElementById('tabla-maquinas-body');

            const filtradas = maquinasData.filter(maq => {
                const id = String(maq.id_maquina || maq.id || '');
                const nombre = (maq.nombre || '').toLowerCase();
                const ubicacion = (maq.ubicacion || '').toLowerCase();
                const estadoMaq = maq.estado || '';

                const coincideTexto = !texto || nombre.includes(texto) || id.includes(texto) || ubicacion.includes(texto);
                const coincideEstado = !estado || estadoMaq === estado;
                return coincideTexto && coincideEstado;
            });

            document.getElementById('contadorMaquinas').textContent = filtradas.length + ' resultado' + (filtradas.length !== 1 ? 's' : '');

            tbody.innerHTML = '';
            if (filtradas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px; color: #7f8c8d;">No se encontraron máquinas con esos criterios.</td></tr>';
                return;
            }
            filtradas.forEach(maq => {
                const id = maq.id_maquina || maq.id || 'N/A';
                const nombre = maq.nombre || 'Sin nombre';
                const estadoM = maq.estado || 'Activo';
                const ubicacion = maq.ubicacion || 'Taller Principal';
                let fecha = maq.ultima_revision || '';
                if (fecha.includes(' ')) fecha = fecha.split(' ')[0];

                let badgeClass = 'success';
                let estadoTexto = estadoM.toLowerCase();
                if (estadoTexto.includes('mant') || estadoTexto.includes('rep')) badgeClass = 'warning';
                if (estadoTexto.includes('baja') || estadoTexto.includes('rot')) badgeClass = 'danger';

                tbody.innerHTML += `
                    <tr>
                        <td><strong>MAQ-${id}</strong></td>
                        <td>${nombre}</td>
                        <td><span class="status-badge ${badgeClass}">${estadoM}</span></td>
                        <td>${ubicacion}</td>
                        <td>${fecha}</td>
                        <td class="action-buttons">
                            <button class="btn-icon" title="Ver Piezas" onclick="abrirModalPiezas(${id})">📦</button>
                            <button class="btn-icon" title="Editar" onclick="editarMaquina(${id})">✏️</button>
                            <button class="btn-icon" title="Eliminar" style="color: #e74c3c;" onclick="borrarMaquina(${id})">🗑️</button>
                        </td>
                    </tr>
                `;
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderMenu();
            cargarMaquinas();
        });
    </script>
</body>

</html>
