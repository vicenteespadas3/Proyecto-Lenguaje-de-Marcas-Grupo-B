<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gamas de Mantenimiento</title>
    <link rel="stylesheet" href="../../CSS/estilos.css">
    <link rel="stylesheet" href="../../CSS/menu.css">
</head>

<body>
    <div class="app-body theme-activos">
        <main class="main-content">

            <header class="header">
                <div class="header-info">
                    <h1>Panel de Maquinaria</h1>
                    <p>Gestión de inventario técnico y activos</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="abrirModalAlta()">
                        + Añadir Nueva Máquina
                    </button>
                </div>
            </header>

            <!-- Barra de Búsqueda y Filtros Avanzada -->
            <div class="search-filters-container">
                <div class="search-filters-bar">
                    <div class="search-group">
                        <div class="search-input-wrapper">
                            <input type="text" id="searchMaquina" placeholder="Buscar por nombre, serie, fabricante...">
                        </div>
                        <button class="btn btn-primary btn-search" onclick="filtrarMaquinas()">
                            🔍 Buscar
                        </button>
                    </div>
                    <div class="filter-actions">
                        <button class="btn btn-secondary" onclick="togglePanelFiltros()">
                            ➕ Filtros
                        </button>
                        <div class="dropdown-ordenar-container">
                            <button class="btn btn-secondary" onclick="toggleDropdownOrden(event)">
                                ⇅ Ordenar
                            </button>
                            <div id="dropdownOrden" class="dropdown-orden-content">
                                <div class="dropdown-orden-item" onclick="cambiarCriterioOrden('id')">
                                    <span>ID</span>
                                    <span class="check-icon"></span>
                                </div>
                                <div class="dropdown-orden-item" onclick="cambiarCriterioOrden('nombre')">
                                    <span>Nombre</span>
                                    <span class="check-icon"></span>
                                </div>
                                <div class="dropdown-orden-item" onclick="cambiarCriterioOrden('tipo')">
                                    <span>Tipo (Alfabéticamente)</span>
                                    <span class="check-icon"></span>
                                </div>
                                <div class="dropdown-orden-item" onclick="cambiarCriterioOrden('estado')">
                                    <span>Estado (Disponibilidad)</span>
                                    <span class="check-icon"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Panel de Filtros (Expandible) -->
                <div id="panelFiltros" class="filter-panel" style="display: none;">
                    <div class="filter-grid">
                        <div class="filter-item">
                            <label>Estado</label>
                            <select id="filtroEstado" class="filter-select">
                                <option value="">Todos los estados</option>
                                <option value="disponible">Disponible</option>
                                <option value="en_mantenimiento">En Mantenimiento</option>
                                <option value="averia">Avería</option>
                                <option value="desactivada">Desactivada</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label>Ubicación</label>
                            <input type="text" id="filtroUbicacion" placeholder="Ej: Nave 1">
                        </div>
                        <div class="filter-item">
                            <label>Tipo</label>
                            <input type="text" id="filtroTipo" placeholder="Ej: Torno">
                        </div>
                    </div>
                    <div class="filter-panel-actions">
                        <button class="btn btn-secondary btn-small" onclick="limpiarFiltros()">Limpiar</button>
                        <button class="btn btn-primary btn-small" onclick="filtrarMaquinas()">Aplicar Filtros</button>
                    </div>
                </div>
                
                <div class="results-info">
                    <span id="contadorMaquinas" class="search-results-count">0 resultados encontrados</span>
                </div>
            </div>

            <section class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Equipo / Modelo</th>
                            <th>Tipo</th>
                            <th>Nº Serie</th>
                            <th>Estado</th>
                            <th>Ubicación</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-maquinas-body">
                        <!-- Se carga vía JS -->
                    </tbody>
                </table>
            </section>

        </main>

        <!-- Modal para Crear/Editar Máquina -->
        <div id="modalMaquina" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitulo">Nueva Máquina</h2>
                    <button class="btn-close" onclick="cerrarModal()">×</button>
                </div>
                <form id="formMaquina" onsubmit="guardarMaquina(event)">
                    <input type="hidden" id="maq_id">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Nombre del Equipo</label>
                            <input type="text" id="maq_nombre" required placeholder="Ej: Torno CNC Mod. Alpha">
                        </div>
                        <div class="form-group">
                            <label>Tipo</label>
                            <input type="text" id="maq_tipo" placeholder="Ej: Mecánico / Hidráulico">
                        </div>
                        <div class="form-group">
                            <label>Número de Serie</label>
                            <input type="text" id="maq_serie" placeholder="SN-XXXXXX">
                        </div>
                        <div class="form-group">
                            <label>Fabricante</label>
                            <input type="text" id="maq_fabricante" placeholder="Marca / Empresa">
                        </div>
                        <div class="form-group">
                            <label>Estado</label>
                            <select id="maq_estado">
                                <option value="disponible">Disponible</option>
                                <option value="en_mantenimiento">En Mantenimiento</option>
                                <option value="averia">Avería</option>
                                <option value="desactivada">Desactivada (Baja)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Ubicación</label>
                            <input type="text" id="maq_ubicacion" placeholder="Sección / Nave">
                        </div>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Máquina</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Modal para las Piezas (Sara) -->
        <div id="modalPiezas" class="modal-overlay">
            <div class="modal-content" style="max-width: 700px;">
                <div class="modal-header">
                    <h2 id="tituloPiezas">Piezas de la Máquina</h2>
                    <button class="btn-close" onclick="cerrarModal('modalPiezas')">×</button>
                </div>
                <table style="width: 100%; margin-top: 15px;">
                    <thead>
                        <tr>
                            <th>Pieza</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-piezas-modal-body"></tbody>
                </table>
                <div class="modal-actions" style="margin-top: 20px;">
                    <button class="btn btn-secondary" onclick="cerrarModal('modalPiezas')">Cerrar</button>
                    <button class="btn btn-primary" onclick="mostrarSeccionAnadirPieza()">+ Añadir Pieza</button>
                </div>

                <div id="seccionAnadirPieza" style="display: none; margin-top: 20px; padding-top: 15px; border-top: 1px solid #ddd;">
                    <h3 style="margin-bottom: 10px; font-size: 1.1em;">Asignar Nueva Pieza</h3>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <select id="selectNuevaPieza" style="flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
                            <option value="">Cargando piezas...</option>
                        </select>
                        <button class="btn btn-primary" onclick="asignarPiezaAMaquina()">Asignar</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="../../Js/app.js"></script>
    <script>
        /* ==========================================================================
          LÓGICA JAVASCRIPT (Controlador del Frontend)
          Interactúa con: ../../api/activos/maquinas.php y ../../api/inventario/piezas.php
        =========================================================================== */
        let maquinasData = []; // Array temporal para guardar los datos cargados desde PHP
        let ordenAsc = true;   // Estado de la dirección de la ordenación
        let criterioOrden = 'id'; // Columna por la cual se está ordenando

        /**
         * Petición principal (GET) para traer la lista de máquinas desde la base de datos
         */
        async function cargarMaquinas() {
            const tbody = document.getElementById('tabla-maquinas-body');
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px;">Cargando inventario... ⚙️</td></tr>';

            const res = await api('GET', '../../api/activos/maquinas.php');
            if (res && res.ok) {
                maquinasData = res.maquinas || [];
                aplicarOrden(); // Aseguramos el orden inicial
                filtrarMaquinas();
                actualizarUIOrden();
            } else {
                tbody.innerHTML = `<tr><td colspan="7" class="error-msg">Error: ${res.error || 'No se pudo conectar'}</td></tr>`;
            }
        }

        function togglePanelFiltros() {
            const p = document.getElementById('panelFiltros');
            p.style.display = p.style.display === 'none' ? 'block' : 'none';
        }

        function toggleDropdownOrden(event) {
            event.stopPropagation();
            const dropdown = document.getElementById('dropdownOrden');
            dropdown.classList.toggle('show');
        }

        function cambiarCriterioOrden(criterio) {
            if (criterioOrden === criterio) {
                ordenAsc = !ordenAsc; // Invierte el orden si es el mismo criterio
            } else {
                criterioOrden = criterio;
                ordenAsc = true; // Por defecto ascendente al cambiar de criterio
            }
            aplicarOrden();
            filtrarMaquinas();
            actualizarUIOrden();
            
            // Cerrar el dropdown después de elegir
            document.getElementById('dropdownOrden').classList.remove('show');
        }

        function obtenerRangoEstado(estado) {
            switch (estado) {
                case 'disponible': return 1;
                case 'en_mantenimiento': return 2;
                case 'averia': return 3;
                case 'desactivada': return 4;
                default: return 5;
            }
        }

        function aplicarOrden() {
            maquinasData.sort((a, b) => {
                let valA, valB;
                if (criterioOrden === 'nombre') {
                    valA = (a.nombre || '').toLowerCase();
                    valB = (b.nombre || '').toLowerCase();
                    return ordenAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                } else if (criterioOrden === 'tipo') {
                    valA = (a.tipo || '').toLowerCase();
                    valB = (b.tipo || '').toLowerCase();
                    return ordenAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                } else if (criterioOrden === 'estado') {
                    valA = obtenerRangoEstado(a.estado);
                    valB = obtenerRangoEstado(b.estado);
                    return ordenAsc ? valA - valB : valB - valA;
                } else { // id
                    valA = parseInt(a.id_maquina);
                    valB = parseInt(b.id_maquina);
                    return ordenAsc ? valA - valB : valB - valA;
                }
            });
        }

        function actualizarUIOrden() {
            // Limpiar clases active y checkmarks
            document.querySelectorAll('.dropdown-orden-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelectorAll('.check-icon').forEach(icon => {
                icon.textContent = '';
            });

            // Establecer el activo
            const activeItem = document.querySelector(`.dropdown-orden-item[onclick*="'${criterioOrden}'"]`);
            if (activeItem) {
                activeItem.classList.add('active');
                const icon = activeItem.querySelector('.check-icon');
                if (icon) {
                    icon.textContent = ordenAsc ? '▲' : '▼';
                }
            }
        }

        // Cerrar dropdown al hacer click fuera
        window.addEventListener('click', (e) => {
            const dropdown = document.getElementById('dropdownOrden');
            if (dropdown && !e.target.closest('.dropdown-ordenar-container')) {
                dropdown.classList.remove('show');
            }
        });

        function limpiarFiltros() {
            document.getElementById('searchMaquina').value = '';
            document.getElementById('filtroEstado').value = '';
            document.getElementById('filtroUbicacion').value = '';
            document.getElementById('filtroTipo').value = '';
            filtrarMaquinas();
        }

        /**
         * Aplica los valores de los inputs de búsqueda y filtros al array `maquinasData`.
         * Renderiza el HTML de la tabla con los resultados obtenidos.
         */
        function filtrarMaquinas() {
            const search = document.getElementById('searchMaquina').value.toLowerCase();
            const estadoF = document.getElementById('filtroEstado').value;
            const ubicF = document.getElementById('filtroUbicacion').value.toLowerCase();
            const tipoF = document.getElementById('filtroTipo').value.toLowerCase();
            const tbody = document.getElementById('tabla-maquinas-body');

            const filtradas = maquinasData.filter(m => {
                const matchSearch = !search || 
                    m.nombre.toLowerCase().includes(search) || 
                    (m.numero_serie && m.numero_serie.toLowerCase().includes(search)) ||
                    (m.fabricante && m.fabricante.toLowerCase().includes(search));
                
                const matchEstado = !estadoF || m.estado === estadoF;
                const matchUbic = !ubicF || (m.ubicacion && m.ubicacion.toLowerCase().includes(ubicF));
                const matchTipo = !tipoF || (m.tipo && m.tipo.toLowerCase().includes(tipoF));

                return matchSearch && matchEstado && matchUbic && matchTipo;
            });

            document.getElementById('contadorMaquinas').textContent = `${filtradas.length} resultados encontrados`;
            
            tbody.innerHTML = '';
            if (filtradas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No hay resultados</td></tr>';
                return;
            }

            filtradas.forEach(m => {
                let bClass = 'success';
                if (m.estado === 'en_mantenimiento') bClass = 'warning';
                if (m.estado === 'averia' || m.estado === 'desactivada') bClass = 'danger';
                
                const estadoTxt = m.estado.charAt(0).toUpperCase() + m.estado.slice(1).replace('_', ' ');

                tbody.innerHTML += `
                    <tr>
                        <td><strong>MAQ-${m.id_maquina}</strong></td>
                        <td>
                            <div style="font-weight:bold;">${m.nombre}</div>
                            <small style="color:#7f8c8d;">${m.fabricante || 'Sin fabricante'}</small>
                        </td>
                        <td>${m.tipo || '-'}</td>
                        <td><code>${m.numero_serie || 'N/A'}</code></td>
                        <td><span class="status-badge ${bClass}">${estadoTxt}</span></td>
                        <td>${m.ubicacion || '-'}</td>
                        <td class="action-buttons">
                            <button class="btn-icon" title="Ver Piezas" onclick="abrirModalPiezas(${m.id_maquina})">📦</button>
                            <button class="btn-icon" title="Editar" onclick="editarMaquina(${m.id_maquina})">✏️</button>
                            <button class="btn-icon" title="Eliminar" style="color:#e74c3c;" onclick="borrarMaquina(${m.id_maquina})">🗑️</button>
                        </td>
                    </tr>
                `;
            });
        }

        /**
         * Abre el modal preparado para registrar una NUEVA máquina.
         */
        function abrirModalAlta() {
            document.getElementById('modalTitulo').textContent = 'Añadir Nueva Máquina';
            document.getElementById('formMaquina').reset();
            document.getElementById('maq_id').value = '';
            document.getElementById('modalMaquina').classList.add('show');
        }

        /**
         * Abre el modal cargando los datos de una máquina existente para editarla.
         * @param {number} id - El identificador de la máquina
         */
        function editarMaquina(id) {
            const m = maquinasData.find(x => x.id_maquina == id);
            if (!m) return;
            document.getElementById('modalTitulo').textContent = 'Editar Máquina';
            document.getElementById('maq_id').value = m.id_maquina;
            document.getElementById('maq_nombre').value = m.nombre;
            document.getElementById('maq_tipo').value = m.tipo || '';
            document.getElementById('maq_serie').value = m.numero_serie || '';
            document.getElementById('maq_fabricante').value = m.fabricante || '';
            document.getElementById('maq_estado').value = m.estado;
            document.getElementById('maq_ubicacion').value = m.ubicacion || '';
            document.getElementById('modalMaquina').classList.add('show');
        }

        function cerrarModal(id = 'modalMaquina') {
            document.getElementById(id).classList.remove('show');
        }

        /**
         * Maneja el envío (submit) del formulario de crear/editar máquina.
         * Llama a: api/activos/maquinas.php (POST o PUT)
         */
        async function guardarMaquina(e) {
            e.preventDefault();
            const id = document.getElementById('maq_id').value;
            const payload = {
                nombre: document.getElementById('maq_nombre').value,
                tipo: document.getElementById('maq_tipo').value,
                numero_serie: document.getElementById('maq_serie').value,
                fabricante: document.getElementById('maq_fabricante').value,
                estado: document.getElementById('maq_estado').value,
                ubicacion: document.getElementById('maq_ubicacion').value
            };
            const res = await api(id ? 'PUT' : 'POST', '../../api/activos/maquinas.php', id ? {...payload, id_maquina: id} : payload);
            if (res.ok) { cerrarModal(); cargarMaquinas(); }
            else alert(res.error || 'Error al guardar');
        }

        /**
         * Elimina una máquina tras solicitar confirmación al usuario.
         * Llama a: api/activos/maquinas.php (DELETE)
         */
        async function borrarMaquina(id) {
            if (!confirm('¿Seguro?')) return;
            const res = await api('DELETE', '../../api/activos/maquinas.php', { id_maquina: id });
            if (res.ok) cargarMaquinas();
            else alert(res.error || 'No se puede eliminar');
        }

        // ========================================================================
        // Lógica para asociar PIEZAS a la máquina (Modal de Piezas) - Autor: Sara
        // ========================================================================
        let maquinaActual = null;
        async function abrirModalPiezas(id) {
            maquinaActual = id;
            document.getElementById('modalPiezas').classList.add('show');
            const tbody = document.getElementById('tabla-piezas-modal-body');
            tbody.innerHTML = '<tr><td colspan="3">Cargando...</td></tr>';
            const res = await api('GET', `../../api/inventario/piezas.php?id_maquina=${id}`);
            if (res && res.piezas) {
                tbody.innerHTML = res.piezas.map(p => `
                    <tr>
                        <td>${p.nombre || 'Sin nombre'}</td>
                        <td>${p.stock_actual || 0}</td>
                        <td><button class="btn-icon" style="color:red;" onclick="quitarAsignacion(${p.id_pieza})">❌</button></td>
                    </tr>
                `).join('') || '<tr><td colspan="3">Sin piezas</td></tr>';
            }
        }
        async function quitarAsignacion(id) {
            if (await api('DELETE', `../../api/inventario/piezas.php?id_maquina=${maquinaActual}&id_pieza=${id}`)) {
                abrirModalPiezas(maquinaActual);
            }
        }
        async function mostrarSeccionAnadirPieza() {
            const s = document.getElementById('seccionAnadirPieza');
            s.style.display = s.style.display === 'none' ? 'block' : 'none';
            if (s.style.display === 'block') {
                const res = await api('GET', '../../api/inventario/pedidos_opciones.php');
                const sel = document.getElementById('selectNuevaPieza');
                sel.innerHTML = res.piezas.map(p => `<option value="${p.id_pieza}">${p.nombre}</option>`).join('');
            }
        }
        async function asignarPiezaAMaquina() {
            const p = document.getElementById('selectNuevaPieza').value;
            if (await api('POST', '../../api/inventario/piezas.php', {id_maquina: maquinaActual, id_pieza: p})) {
                document.getElementById('seccionAnadirPieza').style.display = 'none';
                abrirModalPiezas(maquinaActual);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderMenu();
            cargarMaquinas();
        });
    </script>
</body>

</html>
