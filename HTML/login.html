<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Guadalupe MGM">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Mecatrónica - Login</title>
    <link rel="stylesheet" href="../CSS/menu.css">
    <style>
        .login-body {
            /* Inherits the gradient from menu.css main menu */
            background: linear-gradient(135deg, #1e293b, #0f172a);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: #333;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: formFadeIn 0.5s ease;
        }
        @keyframes formFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-container h1 {
            color: #1e293b;
            margin-bottom: 10px;
            font-size: 1.8em;
        }
        .login-container p {
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-group input:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 5px rgba(59, 130, 246, 0.5);
        }
        .btn-login {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 10px;
        }
        .btn-login:hover {
            background-color: #2563eb;
        }
        .btn-login:active {
            transform: scale(0.98);
        }
        .login-logo {
            font-size: 4em;
            margin-bottom: 10px;
        }
    </style>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-logo">⚙️</div>
        <h1>ERP Mecatrónica</h1>
        <p>Inicia sesión para continuar</p>
        <form id="formLogin">
            <div class="form-group">
                <label for="username">Correo o ID de Usuario</label>
                <input type="text" id="username" name="username" placeholder="Ingresa tu correo o ID numérico">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña">
            </div>
            <div id="error-msg" style="color: #e74c3c; margin-bottom: 10px; font-weight: bold; display: none;"></div>
            <button type="submit" class="btn-login">Ingresar al Sistema</button>
        </form>
    </div>

    <script src="../Js/app.js"></script>
    <script>
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // ====================================================================
            // BYPASS DE LOGIN (MODIFICACIÓN PARA DESARROLLO)
            // Motivo: Al igual que en app.js, se salta la comprobación real con el 
            // servidor (login.php). Al hacer clic en "Ingresar", te lleva directo a inicio.html.
            // Esto evita errores de red ("Failed to fetch") si el servidor no está corriendo.
            // ====================================================================
            window.location.href = 'inicio.html';
            
            // CÓDIGO REAL DE AUTENTICACIÓN (Comentado temporalmente):
            /* 
            const usuario = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errMsg = document.getElementById('error-msg');
            errMsg.style.display = 'none';

            // Petición a la API PHP conectada a MySQL
            const resp = await api('POST', '../api/auth/login.php', {usuario, password});
            
            if (resp.ok) {
                window.location.href = 'inicio.html';
            } else {
                errMsg.textContent = resp.error || 'Credenciales incorrectas';
                errMsg.style.display = 'block';
            }
            */
        });
    </script>
</body>
</html>
