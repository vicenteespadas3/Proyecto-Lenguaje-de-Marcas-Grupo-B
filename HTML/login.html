<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Guadalupe MGM">
    <title>Login ERP - Robots</title>
    <link rel="stylesheet" href="../CSS/loginPrueba.css">
</head>
<body>

<div class="login-container">
    <div class="login-visual">
        <div class="machines">
            <div class="machine" id="bot-normal">
                <div class="antenna"></div>
                <div class="head">
                    <svg class="face" viewBox="0 0 100 100">
                        <circle cx="35" cy="45" r="12" fill="#1a1a1a"/>
                        <circle cx="65" cy="45" r="12" fill="#1a1a1a"/>
                        <circle cx="35" cy="45" r="5" class="eye" fill="#00ff00"/>
                        <circle cx="65" cy="45" r="5" class="eye" fill="#00ff00"/>
                        <rect x="35" y="75" width="30" height="4" class="mouth" fill="#ecf0f1"/>
                    </svg>
                    <svg class="hand left-hand" viewBox="0 0 100 100"><path d="M50 80 Q 20 50, 50 20 L 70 20 Q 90 50, 70 80 Z" fill="#3498db" stroke="#2c3e50" stroke-width="5"/></svg>
                    <svg class="hand right-hand" viewBox="0 0 100 100"><path d="M50 80 Q 80 50, 50 20 L 30 20 Q 10 50, 30 80 Z" fill="#3498db" stroke="#2c3e50" stroke-width="5"/></svg>
                </div>
                <div class="torso">
                    <div class="panel"><div class="dot red"></div><div class="dot yellow"></div></div>
                </div>
            </div>

            <div class="machine spy" id="bot-spy">
                <div class="antenna"></div>
                <div class="head">
                    <svg class="face" viewBox="0 0 100 100">
                        <circle cx="35" cy="45" r="12" fill="#1a1a1a"/>
                        <circle cx="65" cy="45" r="12" fill="#1a1a1a"/>
                        <circle cx="35" cy="45" r="5" class="eye" fill="#00ff00"/>
                        <circle cx="65" cy="45" r="5" class="eye" fill="#00ff00"/>
                        <rect x="35" y="75" width="30" height="4" class="mouth" fill="#ecf0f1"/>
                    </svg>
                    <svg class="hand left-hand" viewBox="0 0 100 100"><path d="M50 80 Q 20 50, 50 20 L 70 20 Q 90 50, 70 80 Z" fill="#3498db" stroke="#2c3e50" stroke-width="5"/></svg>
                    <svg class="hand right-hand" viewBox="0 0 100 100"><path d="M50 80 Q 80 50, 50 20 L 30 20 Q 10 50, 30 80 Z" fill="#3498db" stroke="#2c3e50" stroke-width="5"/></svg>
                </div>
                <div class="torso">
                    <div class="panel"><div class="dot blue"></div><div class="dot red"></div></div>
                </div>
            </div>
        </div>
    </div>

    <div class="login-box">
        <h1>🔐 ERP Mecatrónica</h1>
        <p>Inicia sesión para continuar</p>
        <form id="loginForm">
            <input type="text" placeholder="Usuario" required class="input">
            <input type="password" id="password" placeholder="Contraseña" required class="input">
            <button type="submit" class="btn-login">Entrar</button>
        </form>
        <p id="error-msg">❌ Acceso Denegado</p>
    </div>
</div>

<script src="../Js/loginPrueba.js"></script>
</body>
</html>
